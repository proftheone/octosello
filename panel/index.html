<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/octosello-logo.png">
<title>Octosello Panel Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: panel firmy — stała ciemna kolumna nawigacji (obszary compliance) po lewej, obszar roboczy po prawej; na telefonie nawigacja to przewijany pasek u góry */
:root{
  --bg:#0A0B0B; --surface:#121514; --sunk:#1A1E1D; --raise:#202524; --line:#262C2A; --ink:#EEF2EF; --muted:#959E99; --dim:#6F7873;
  --mint:#95FFD1; --mint-ink:#0B1A14; --mint-soft:#14302A;
  --amber:#F2B25C; --amber-soft:#33260F; --red:#FF8A7A; --red-soft:#3A1A16; --blue:#9DBBFF; --blue-soft:#18223A;
  --f-body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--mint)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.03em}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;position:relative;overflow-x:clip}
.glow{position:absolute;left:58%;top:-320px;transform:translateX(-50%);width:1000px;max-width:100%;height:760px;background:radial-gradient(closest-side,rgba(149,255,209,.13),rgba(149,255,209,.03) 55%,transparent 75%);pointer-events:none;z-index:0}

/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:16px 12px;display:flex;flex-direction:column;gap:14px;z-index:2}
.side-in{background:var(--surface);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.05);padding:18px 12px;display:flex;flex-direction:column;gap:16px;height:100%;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.brand img{height:24px;width:auto}
.brand .free{font-size:11px;font-weight:600;background:var(--mint);color:var(--mint-ink);border-radius:999px;padding:3px 9px}
.shop{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--sunk);border:0;text-align:left;width:100%}
.shop:hover{background:var(--raise)}
.shop-i{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(160deg,#c9ffe6,var(--mint) 45%,#4fd9a2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.shop b{display:block;font-size:14px;font-weight:600}
.shop small{color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
.nav-l{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 4px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left;color:var(--muted);font-weight:500;font-size:14px;min-height:38px}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="true"]{background:var(--raise);color:var(--ink)}
nav button[aria-current="true"] .ic{color:var(--mint)}
nav .ic{width:18px;height:18px;flex:none}
nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-grid;place-items:center;background:var(--sunk);color:var(--muted)}
nav .cnt.hot{background:var(--amber-soft);color:var(--amber)}
nav .cnt.red{background:var(--red-soft);color:var(--red)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.side-foot small{color:var(--dim);font-size:12px}

/* main */
main{position:relative;z-index:1;padding-block:22px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:8px 14px;color:var(--muted);flex:1 1 260px;max-width:420px;box-shadow:inset 0 0 0 1px var(--line)}
.search input{background:none;border:0;outline:0;flex:1;min-width:0;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}
.spacer{flex:1}
.example{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:4px 8px}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.who i{width:28px;height:28px;border-radius:50%;background:var(--raise);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:var(--mint)}

.head{display:flex;flex-direction:column;gap:6px}
.head small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.head h1{font-size:clamp(28px,3.4vw,44px);font-weight:300;line-height:1.08}
.head h1 b{font-weight:700;color:var(--mint)}
.head p{margin:0;color:var(--muted);max-width:68ch}
.state{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.btn{border:0;background:var(--sunk);border-radius:999px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);min-height:40px}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--mint);color:var(--mint-ink);box-shadow:none}
.btn.primary:hover{background:#B5FFE0}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px rgba(149,255,209,.55),0 0 18px -8px rgba(149,255,209,.6)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn svg{width:15px;height:15px}

.card{background:var(--surface);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),inset 0 0 0 1px var(--line);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.card-h .hint{color:var(--muted);font-size:13px}
.card-b{padding:16px 18px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.todo{background:var(--sunk);color:var(--muted)}
.pill.progress{background:var(--blue-soft);color:var(--blue)}
.pill.waiting{background:var(--amber-soft);color:var(--amber)}
.pill.done{background:var(--mint-soft);color:var(--mint)}
.pill.overdue{background:var(--red-soft);color:var(--red)}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--ink);white-space:nowrap}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px;border-radius:18px;background:linear-gradient(120deg,rgba(149,255,209,.10),rgba(149,255,209,.02) 60%),var(--surface);box-shadow:inset 0 0 0 1px rgba(149,255,209,.22)}
.setup h2{font-size:19px;font-weight:600}
.setup p{margin:4px 0 10px;color:var(--muted);max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:5px 12px;font-weight:500;font-size:13px;box-shadow:inset 0 0 0 1px var(--line);min-height:32px}
button.chip:hover{background:var(--raise)}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);box-shadow:none}
.chip .mono{opacity:.7;margin-left:4px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:400}
.kpi .d{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--mint);border-radius:3px;transition:width .4s}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .t{font-weight:500;min-width:0}
.row .t small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:1px}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.date{width:52px;text-align:center;border-radius:10px;background:var(--sunk);padding:6px 0;line-height:1.1}
.date b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.date span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}
.date.soon{background:var(--amber-soft)}.date.soon b{color:var(--amber)}
.date.late{background:var(--red-soft)}.date.late b{color:var(--red)}
.days{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.days.late{color:var(--red)}.days.soon{color:var(--amber)}
.aic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--mint);flex:none}
.aic svg{width:18px;height:18px}

/* area bars */
.areas{display:flex;flex-direction:column}
.area-r{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:12px;align-items:center;padding:10px 18px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.area-r:last-child{border-bottom:0}
.area-r:hover{background:var(--sunk)}
.area-r b{font-weight:600}
.stbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);gap:2px}
.stbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}

.log div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);align-items:center}
.log div:last-child{border-bottom:0}
.log img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.log b{font-weight:500;display:block}
.log span{color:var(--muted);font-size:12.5px}

/* table */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td .t{font-weight:500}
td small{display:block;color:var(--muted);font-size:12.5px}
.owner{display:flex;align-items:center;gap:8px;white-space:nowrap}
.owner img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.owner i{width:24px;height:24px;border-radius:50%;background:var(--raise);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:600;color:var(--mint)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

/* area header */
.ahead{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:14px;align-items:stretch}
.expert{display:flex;gap:14px;align-items:center;padding:16px}
.expert img{width:64px;height:64px;border-radius:16px;object-fit:cover;object-position:50% 18%;flex:none}
.expert b{display:block;font-size:15px}
.expert small{color:var(--muted);display:block;margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:12px 18px}
.facts b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px var(--line);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:36px}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--ink)}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.svc .card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.svc h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.svc p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.svc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.svc .ft span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.health{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center;padding:20px}
.ring{position:relative;width:160px;height:160px;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--sunk)}.ring .fg{stroke:var(--mint);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:38px;font-weight:600;letter-spacing:-.03em;display:block;line-height:1}
.ring .t span{font-size:12px;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:10px 12px}
.ck .s{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ck .s.ok{background:var(--mint);color:var(--mint-ink)}
.ck .s.mid{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.ck .s.no{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ck b{font-weight:500;display:block}
.ck small{color:var(--muted);font-size:12.5px}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.cell{border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap;min-height:30px}
.cell.done{background:var(--mint-soft);color:var(--mint)}
.cell.progress{background:var(--blue-soft);color:var(--blue)}
.cell.todo{background:var(--amber-soft);color:var(--amber)}
.cell.na{background:none;color:var(--dim);font-weight:400}
.flag{font-family:var(--f-mono);font-size:11px;background:var(--raise);border-radius:5px;padding:2px 6px;margin-right:8px}

/* calendar */
.cal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-h h2{font-size:20px;font-weight:600;min-width:180px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.cal .dn{background:var(--surface);padding:8px 10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase}
.cal .d{background:var(--surface);min-height:96px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d.out{background:var(--bg)}
.cal .d.out .n{color:var(--dim)}
.cal .d .n{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .d.today .n{background:var(--mint);color:var(--mint-ink);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-weight:600}
.ev{border:0;text-align:left;border-radius:6px;padding:3px 6px;font-size:11.5px;line-height:1.3;background:var(--sunk);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;border-left:3px solid var(--c,var(--mint))}
.ev:hover{background:var(--raise)}

/* docs */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted)}
.drop.over{border-color:var(--mint);background:var(--mint-soft)}
.drop b{color:var(--ink);font-weight:500}
.fic{width:34px;height:40px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;color:var(--muted);flex:none;box-shadow:inset 0 0 0 1px var(--line)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(3,5,5,.62);z-index:50;display:flex;justify-content:flex-end;backdrop-filter:blur(3px)}
.scrim.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);box-shadow:-1px 0 0 var(--line);overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:18px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dlg{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line),0 40px 80px -30px rgba(0,0,0,.7);padding:22px;display:flex;flex-direction:column;gap:16px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dh h2{font-size:22px;font-weight:600;line-height:1.2}
.x{border:0;background:var(--sunk);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--raise)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--sunk);color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sec h3{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sec p{margin:0;color:var(--ink);max-width:62ch}
.steps{display:flex;flex-direction:column;gap:6px}
.steps label{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;cursor:pointer}
.steps input{accent-color:var(--mint);width:16px;height:16px;margin-top:2px;flex:none}
.steps label.done span{color:var(--muted);text-decoration:line-through}
.basis{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.cta-box{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:14px;padding:12px;flex-wrap:wrap}
.cta-box img{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:50% 18%}
.cta-box div{flex:1;min-width:160px}
.cta-box small{display:block;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],select,textarea{background:var(--sunk);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;padding:10px 12px;min-width:0;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts label{flex-direction:row;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:400}
.opts label small{display:block;color:var(--muted);font-size:12px}
.opts input{accent-color:var(--mint);width:16px;height:16px;flex:none}
.dlg-f{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dlg-f .hint{color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--mint);color:var(--mint-ink);padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);max-width:calc(100% - 32px)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.ahead{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:10px max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px))}
  .side-in{padding:12px;gap:10px;overflow:visible}
  .shop,.side-foot{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav button{flex:none}
  .nav-l{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .setup{grid-template-columns:minmax(0,1fr)}
  .health{grid-template-columns:minmax(0,1fr)}
  .checks,.opts{grid-template-columns:minmax(0,1fr)}
  .cal .d{min-height:64px;padding:4px}
  .ev{font-size:0;padding:0;height:6px;border-left:0;background:var(--c,var(--mint))}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:minmax(0,1fr)}.area-r{grid-template-columns:80px minmax(0,1fr) 44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function obls(){
 return CATALOG.filter(o=>o.when(S.profile)).map(o=>{
  const v=S.ov[o.id]||{};
  const st=v.st||o.st; const own=v.own!==undefined?v.own:o.own;
  const sd=v.sd||o.steps.map((_,i)=>i<o.sd);
  return {...o,st,own,sd};
 });
}
const eff=o=>o.st!=='done'&&daysTo(o.due)<0?'overdue':o.st;
const pill=o=>{const e=eff(o);return `<span class="pill ${e}">${e==='overdue'?'Po terminie':STATUS[e]}</span>`};
const ownerHTML=o=>o.own?`<span class="owner"><img src="${EXPERTS[o.own].img}" alt="">${esc(EXPERTS[o.own].n)}</span>`:`<span class="owner"><i>TY</i>Ty</span>`;
const dateBox=s=>{const d=D(s),n=daysTo(s);return `<span class="date ${n<0?'late':n<=14?'soon':''}"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></span>`};
const daysSpan=(o)=>{if(o.st==='done')return `<span class="days">zrobione</span>`;const n=daysTo(o.due);return `<span class="days ${n<0?'late':n<=14?'soon':''}">${daysTxt(n)}</span>`};

  <p style="margin:0;color:var(--muted);font-size:13px">Cenę poznajesz przed startem pracy. Sprawy prowadzi zespół mec. Siwickiej.</p>`;
 if(t==='kondycja'){const sc=Math.round(HEALTH.reduce((a,h)=>a+(h[1]==='ok'?1:h[1]==='mid'?.5:0),0)/HEALTH.length*100);const C=2*Math.PI*70;

/* ---------- KALENDARZ ---------- */
V.kalendarz=function(){
 const [y,m]=S.cal; const first=new Date(y,m,1); const start=new Date(y,m,1-((first.getDay()+6)%7));
 const L=obls(); const by={}; L.forEach(o=>{(by[o.due]=by[o.due]||[]).push(o)});
 CONTRACTS.forEach(c=>{if(c.dec)(by[c.dec]=by[c.dec]||[]).push({id:null,a:'prawo',t:'Umowa: '+c.n,contract:true})});
 const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 let cells=''; for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);const ev=by[k]||[];
  cells+=`<div class="d ${d.getMonth()!==m?'out':''} ${+d===+TODAY?'today':''}"><span class="n">${d.getDate()}</span>${ev.map(o=>`<button type="button" class="ev" style="--c:${AREAS[o.a].c}" ${o.id?`data-open="${o.id}"`:`data-go="prawo"`} title="${esc(o.t)}">${esc(o.t)}</button>`).join('')}</div>`;}
 const monthName=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
 const list=Object.keys(by).filter(k=>{const d=D(k);return d.getFullYear()===y&&d.getMonth()===m}).sort().flatMap(k=>by[k].map(o=>({...o,due:k})));
 $('#main').innerHTML=topbar()+`<div class="head"><small>Terminy ustawowe, umowne i wewnętrzne</small><h1>Kalendarz <b>terminów</b></h1></div>
 <div class="cal-h"><button class="btn sm" type="button" data-cal="-1" aria-label="Poprzedni miesiąc">‹</button><h2>${monthName}</h2><button class="btn sm" type="button" data-cal="1" aria-label="Następny miesiąc">›</button><button class="btn sm" type="button" data-cal="0">Dziś</button><span class="spacer"></span><div class="legend" style="border:0;padding:0">${Object.values(AREAS).map(a=>`<span><i style="background:${a.c}"></i>${a.n}</span>`).join('')}</div></div>
 <div class="tbl-wrap"><div class="cal" style="min-width:320px">${['pon','wt','śr','czw','pt','sob','nd'].map(d=>`<div class="dn">${d}</div>`).join('')}${cells}</div></div>
 <div class="card"><div class="card-h"><h2>W tym miesiącu</h2><span class="hint">${list.length} ${list.length===1?'termin':'terminów'}</span></div><div class="rows">${list.length?list.map(o=>o.contract?`<button class="row" type="button" data-go="prawo">${dateBox(o.due)}<span class="t">${esc(o.t)}<small>Prawo · rejestr umów</small></span><span class="r"><span class="pill waiting">Decyzja</span></span></button>`:`<button class="row" type="button" data-open="${o.id}">${dateBox(o.due)}<span class="t">${esc(o.t)}<small>${AREAS[o.a].n}</small></span><span class="r">${pill(o)}</span></button>`).join(''):`<p class="empty">Brak terminów w tym miesiącu.</p>`}</div></div>`;
};

/* ---------- DOKUMENTY ---------- */
V.dokumenty=function(){

 const stp=d=>d.st==='ok'?'<span class="pill done">Aktualny</span>':d.st==='exp'?`<span class="pill waiting">${esc(d.x||'do odnowienia')}</span>`:d.st==='new'?'<span class="pill progress">Nowy · do opisania</span>':'<span class="pill todo">Projekt</span>';
 $('#main').innerHTML=topbar()+`<div class="head"><small>${S.docs.length} plików</small><h1>Dokumenty <b>gotowe na kontrolę</b></h1><p>Zaświadczenia, umowy, raporty i potwierdzenia złożenia w jednym miejscu, przypisane do obszarów i obowiązków.</p></div>
 <label class="drop" id="drop" for="file">${svg('up','')}<span><b>Dodaj pliki</b> · przeciągnij tutaj albo kliknij. W demo zapisujemy tylko nazwę pliku.</span><input id="file" type="file" multiple hidden></label>
 <div class="filters"><div class="chips" role="group" aria-label="Obszar">${[['all','Wszystkie'],...Object.entries(AREAS).map(([k,a])=>[k,a.n])].map(([k,l])=>`<button type="button" class="chip" data-darea="${k}" aria-pressed="${area===k}">${l}<span class="mono">${k==='all'?S.docs.length:S.docs.filter(d=>d.a===k).length}</span></button>`).join('')}</div></div>
 <div class="card">${L.length?`<div class="tbl-wrap"><table><thead><tr><th>Plik</th><th>Obszar</th><th>Data</th><th>Status</th></tr></thead><tbody>${L.map(d=>`<tr><td><span style="display:flex;gap:12px;align-items:center"><span class="fic">${esc(d.n.split('.').pop().toUpperCase().slice(0,4))}</span><span class="t">${esc(d.n)}</span></span></td><td><span class="tag">${AREAS[d.a].n}</span></td><td class="mono" style="white-space:nowrap">${fmt(d.d)}</td><td>${stp(d)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="empty">Brak dokumentów dla tego filtra.</p>`}</div>`;
 const add=files=>{[...files].forEach(f=>S.docs.unshift({n:f.name,a:area==='all'?'prawo':area,d:'2026-10-25',st:'new'}));save();V.dokumenty();renderNav();toast(`Dodano ${files.length} ${files.length===1?'plik':'pliki'}`)};
 $('#file').onchange=e=>{if(e.target.files.length)add(e.target.files)};
 const dz=$('#drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files.length)add(e.dataTransfer.files)};
};

   o.own?`<div class="cta-box"><img src="${ex.img}" alt=""><div><b>Prowadzi ${esc(ex.n)}</b><small>${esc(ex.role)} · odpowiedź w 24 h</small></div><button class="btn ghost" type="button" data-act="ask" data-ex="${o.own}">Napisz</button></div>`:
   `<div class="cta-box"><img src="${ex.img}" alt=""><div><b>Nie chcesz robić tego sam?</b><small>${esc(ex.n)} · ${esc(ex.role)}</small></div><button class="btn primary" type="button" data-act="delegate">Zleć ekspertowi</button></div>`}
 </aside></div>`);
 const dr=$('.drawer');

 const act=dr.querySelector('[data-act="approve"]'); if(act) act.onclick=()=>{setOv(id,{st:'progress'});S.log.unshift([o.own||a.ex,'Klient zaakceptował: '+o.t,'teraz']);save();refresh();openObl(id);toast('Zaakceptowano. Ekspert kończy sprawę.')};
 const del=dr.querySelector('[data-act="delegate"]'); if(del) del.onclick=()=>{setOv(id,{own:a.ex,st:'progress'});S.log.unshift([a.ex,'Przyjęto zlecenie: '+o.t,'teraz']);save();refresh();openObl(id);toast(`Zlecono: ${EXPERTS[a.ex].n} odezwie się w ciągu 24 h`)};

/* ---------- zdarzenia ---------- */
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-close]')&&(t.matches('[data-close]')||t.closest('button[data-close]'))){closeLayer();return}
 const g=t.closest('[data-go]'); if(g){closeLayer();go(g.dataset.go);return}
 const op=t.closest('[data-open]'); if(op){openObl(op.dataset.open);return}
 const fs=t.closest('[data-fst]'); if(fs){S.f.st=fs.dataset.fst;V.obowiazki();return}
 const da=t.closest('[data-darea]'); if(da){S.f.darea=da.dataset.darea;V.dokumenty();return}
 const pt=t.closest('[data-ptab]'); if(pt){S.ptab=pt.dataset.ptab;save();vArea('prawo');return}
 const cl=t.closest('[data-cal]'); if(cl){const d=+cl.dataset.cal;if(d===0)S.cal=[2026,9];else{let [y,m]=S.cal;m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal=[y,m]}V.kalendarz();return}
 const a=t.closest('[data-act]'); if(!a) return;
 const k=a.dataset.act;
 if(k==='profile') profileDlg();
 if(k==='hide-setup'){S.setupHidden=true;save();V.pulpit()}
 if(k==='ask') askDlg(a.dataset.ex,'');
 if(k==='order') orderDlg(+a.dataset.i);
 if(k==='add-contract') toast('W aplikacji wgrasz umowę, a prawnik wypisze terminy i zobowiązania.');
 if(k==='reset'){try{localStorage.removeItem('octosello-panel-demo-v1')}catch(e){}S=fresh();refresh();toast('Przywrócono dane przykładowe')}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#layer').innerHTML){closeLayer()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-open]')){e.preventDefault();openObl(e.target.dataset.open)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.f.q=e.target.value;const pos=e.target.selectionStart;
  if(S.view==='obowiazki'){$('#otbl').innerHTML=oblTable(filtered());return}
  if(S.view==='dokumenty'){V.dokumenty();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return}
  if(S.f.q.trim()){go('obowiazki');const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
 if(e.target.id==='addc'&&e.target.value){const c=e.target.value;S.profile.markets.push(c);S.countries.push({c,n:MARKETS[c],vat:'todo',pack:'todo',weee:S.profile.cats.elec?'todo':'na',lang:'todo',mkt:S.profile.ch.amazon?'todo':'na'});S.log.unshift(['grzyw','Analiza wymogów: '+MARKETS[c],'teraz']);save();refresh();toast(`${MARKETS[c]} dodane. Mateusz Grzywnowicz przygotuje listę wymogów.`)}
});

const h=(location.hash||'').slice(1);
if(h&&(['pulpit','obowiazki','kalendarz','dokumenty'].includes(h)||AREAS[h]))S.view=h; else S.view='pulpit';
render();
</script>
